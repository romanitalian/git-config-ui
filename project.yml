name: GitConfigs
options:
  bundleIdPrefix: com.romanitalian
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  GitConfigsSPM:
    path: .
targets:
  GitConfigsApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/GitConfigs
    dependencies:
      - package: GitConfigsSPM
        product: GitConfigsLib
    settings:
      base:
        PRODUCT_NAME: GitConfigs
        PRODUCT_BUNDLE_IDENTIFIER: com.romanitalian.GitConfigs
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GitConfigsUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: UITests/GitConfigsUITests
    dependencies:
      - target: GitConfigsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.romanitalian.GitConfigsUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GitConfigsApp:
    build:
      targets:
        GitConfigsApp: all
        GitConfigsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GitConfigsUITests
      # xcodebuild does not forward shell env vars to the UI test runner; set output dir here so
      # testCaptureSectionScreenshots sees SCREENSHOTS_DIR (expanded by Xcode at test time).
      environmentVariables:
        SCREENSHOTS_DIR: $(SRCROOT)/screenshots
